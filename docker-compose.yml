services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl-sentiment-analysis
    ports:
      - "8501:8501"
    volumes:
      # Montar la carpeta de datos para persistencia
      - ./data:/app/data
      # Opcional: montar main.py para desarrollo (hot reload)
      # - ./main.py:/app/main.py
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  etl-network:
    driver: bridge
